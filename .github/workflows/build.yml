
name: Build BuildBuddy

on:
  workflow_dispatch:
  push:
    paths:
      - 'BuildBuddy-GitHub-starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: test -f "BuildBuddy-GitHub-starter.zip"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Extract project
        run: |
          mkdir -p _buildbuddy
          unzip -q -o BuildBuddy-GitHub-starter.zip -d _buildbuddy
          PROJECT_FILE=$(find _buildbuddy -name build.gradle -o -name build.gradle.kts | head -n 1)
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

          
      - name: Fix Loom repository configuration
        run: |
          SETTINGS_FILE=$(find _buildbuddy -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            sed -i 's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' "$SETTINGS_FILE"
            sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' "$SETTINGS_FILE"
          fi


      - name: Build Fabric mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BuildBuddy-JAR
          path: _buildbuddy/**/build/libs/*.jar
          if-no-files-found: error
